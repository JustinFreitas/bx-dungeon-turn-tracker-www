name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build clean bundle
        run: |
          mkdir release
          cp -r public src index.js ecosystem.config.example.js package.json package-lock.json release/
          tar -czvf bx-turn-tracker.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bx-turn-tracker.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
